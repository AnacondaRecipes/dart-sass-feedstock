# The Dart VM in dart-sdk 3.13.4 requires macOS 14 at runtime (the dart-sass
# build runs it); raise the deployment target so the toolchain and the built
# artifact both declare macOS 14 as their floor.
MACOSX_DEPLOYMENT_TARGET:  # [osx]
  - 14.0  # [osx]
c_stdlib_version:  # [osx]
  - 14.0  # [osx]
