# Staging channels carrying the dependency-chain artifacts this build needs
# until dart-sdk and buf are released to pkgs/main (PKG-18211 chain).
# REMOVE these two lines once both packages are on pkgs/main.
channels:
  - https://staging.continuum.io/pbp/fs/dart-sdk-feedstock/pr1/53bd3b5
  - https://staging.continuum.io/pbp/fs/buf-feedstock/pr1/63efe6a

# Route the osx-arm64 build/test to macOS 14 (sonoma) workers: the Dart VM in
# dart-sdk 3.13.4 requires macOS 14 and the dart-sass build runs it (same
# mechanism as pytorch/pyside6 use for ventura).
extra_labels_for_os:
  osx-arm64: [sonoma]
